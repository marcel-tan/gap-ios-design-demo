name: Gap
options:
  bundleIdPrefix: com.marceltan.demo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: "NO"

packages:
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: 8.0.0

targets:
  Gap:
    type: application
    platform: iOS
    sources:
      - path: Gap
    dependencies:
      - package: Kingfisher
    info:
      path: Gap/Info.plist
      properties:
        CFBundleDisplayName: Gap
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Gap uses your location to find stores near you.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marceltan.demo.gap
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: minimal

  GapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GapTests
    dependencies:
      - target: Gap

  GapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GapUITests
    dependencies:
      - target: Gap

schemes:
  Gap:
    build:
      targets:
        Gap: all
        GapTests: [test]
        GapUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - GapTests
        - GapUITests
