name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          if [ -z "$DEVICE" ]; then echo "No iPhone simulator available" >&2; exit 1; fi
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build & test
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Gap.xcodeproj \
            -scheme Gap \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -resultBundlePath build/CI.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild.log

      - name: Upload xcresult
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CI.xcresult
          path: |
            build/CI.xcresult
            build/xcodebuild.log
          if-no-files-found: ignore
